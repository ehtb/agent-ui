name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          node -e "const manifest = require('./package.json'); const expected = 'v' + manifest.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json ' + expected); process.exit(1); }"
      - name: Install TypeScript (the package itself has no dependencies)
        run: npm install --global typescript@5
      - name: Test
        run: npm test
      - name: Update npm (trusted publishing needs 11.5.1 or newer)
        run: npm install --global npm@11
      - name: Stage the release with provenance (trusted publishing, no token; a maintainer approves it on npm)
        run: npm stage publish --access public --provenance
