name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          node -e "const manifest = require('./package.json'); const expected = 'v' + manifest.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json ' + expected); process.exit(1); }"
      - name: Install TypeScript (the package itself has no dependencies)
        run: npm install --global typescript@5
      - name: Test
        run: npm test
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
